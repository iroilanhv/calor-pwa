<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b18">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CALOR">

<title>CALOR</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#0d0812;
 --panel:#17101f;
 --panel2:#21152c;
 --text:#f7effb;
 --muted:#b8a9c1;
 --accent:#ff4d7d;
 --accent2:#b55cff;
 --gold:#ffcc70;
 --green:#65d6a6;
 --border:#392643;
}
html,body{
 margin:0;
 min-height:100%;
 background:
 radial-gradient(circle at 20% 0%,#301337 0,transparent 35%),
 radial-gradient(circle at 100% 20%,#341020 0,transparent 35%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
 padding:
 max(12px,env(safe-area-inset-top))
 12px
 max(18px,env(safe-area-inset-bottom));
}
button,input,select{font:inherit}
button{
 border:0;
 border-radius:13px;
 padding:12px 14px;
 font-weight:800;
 color:white;
 background:linear-gradient(135deg,var(--accent),#9c45ff);
 cursor:pointer;
}
button.secondary{
 background:#2b1d35;
 border:1px solid var(--border);
}
button.ghost{
 background:transparent;
 border:1px solid var(--border);
}
button:disabled{
 opacity:.45;
}
.wrap{
 max-width:720px;
 margin:auto;
}
.logo{
 text-align:center;
 font-size:29px;
 font-weight:950;
 letter-spacing:.13em;
 margin:8px 0 3px;
}
.logo span{color:#ff537f}
.subtitle{
 text-align:center;
 color:var(--muted);
 font-size:12px;
 margin-bottom:14px;
}
.screen{display:none}
.screen.active{display:block}
.panel{
 background:rgba(23,16,31,.94);
 border:1px solid var(--border);
 border-radius:19px;
 padding:15px;
 box-shadow:0 15px 40px #0005;
 margin-bottom:11px;
}
h1,h2,h3,p{margin-top:0}
h2{font-size:18px}
.small{
 font-size:12px;
 color:var(--muted);
}
.field{margin:12px 0}
label{
 display:block;
 font-size:12px;
 color:var(--muted);
 margin-bottom:5px;
}
input,select{
 width:100%;
 padding:12px;
 border-radius:12px;
 border:1px solid var(--border);
 background:#110b17;
 color:white;
 outline:none;
}
.playerGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.consent{
 display:flex;
 gap:9px;
 align-items:flex-start;
 margin:13px 0;
 font-size:12px;
 color:#d9ccdf;
}
.consent input{
 width:auto;
 margin-top:2px;
}
.full{width:100%}
.topbar{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:8px;
}
.meter{
 background:#17101f;
 border:1px solid var(--border);
 border-radius:14px;
 padding:8px 10px;
}
.meterHead{
 display:flex;
 justify-content:space-between;
 font-size:11px;
 margin-bottom:5px;
}
.track{
 height:5px;
 border-radius:9px;
 background:#302139;
 overflow:hidden;
}
.fill{
 height:100%;
 border-radius:9px;
 background:linear-gradient(90deg,#ff4d7d,#ff9966);
 transition:width .4s ease;
}
.tensionFill{
 background:linear-gradient(90deg,#8c5cff,#d95cff);
}
.phaseBar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#21152c;
 border:1px solid #493156;
 border-radius:13px;
 padding:8px 11px;
 margin-bottom:9px;
}
.phaseLabel{
 font-size:10px;
 color:var(--gold);
 font-weight:900;
 letter-spacing:.08em;
}
.phaseName{
 font-size:13px;
 font-weight:900;
}
.round{
 font-size:10px;
 color:var(--muted);
}
.route{
 text-align:center;
 background:#130d19;
 border:1px solid var(--border);
 border-radius:15px;
 padding:10px;
 margin-bottom:9px;
}
.route .names{
 font-size:19px;
 font-weight:950;
}
.arrow{
 color:var(--accent);
 margin:0 7px;
}
.selector{
 font-size:11px;
 color:var(--gold);
 margin-top:3px;
}
.powerNotice{
 border:1px solid #805c27;
 background:#2a1d13;
 border-radius:14px;
 padding:10px;
 margin-bottom:9px;
}
.powerNotice strong{color:#ffd681}
.powerButtons{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px;
}
.powerButtons button{
 padding:8px 10px;
 font-size:11px;
 background:#50391b;
 border:1px solid #87642d;
}
.offerTitle{
 text-align:center;
 font-size:11px;
 color:var(--muted);
 margin:7px 0;
}
.cards{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
}
.cardChoice{
 min-height:75px;
 padding:9px 5px;
 background:#1b1222;
 border:1px solid #422c4d;
 border-radius:13px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 cursor:pointer;
}
.cardChoice .emoji{
 font-size:20px;
 margin-bottom:3px;
}
.cardChoice .cat{
 font-size:10px;
 font-weight:900;
}
.cardChoice .intensity{
 font-size:9px;
 color:var(--muted);
 margin-top:3px;
}
.mission{
 text-align:center;
 padding:14px;
 background:
 radial-gradient(circle at top,#35152d,transparent 70%),
 #18101f;
 border:1px solid #5a304e;
 border-radius:17px;
 margin-top:8px;
}
.missionCat{
 color:var(--gold);
 font-size:10px;
 font-weight:900;
 letter-spacing:.08em;
 margin-bottom:8px;
}
.missionText{
 font-size:18px;
 line-height:1.35;
 font-weight:850;
}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:10px;
}
.pass{
 background:#28202e;
 border:1px solid #55455d;
}
.inventory{
 padding:10px 12px;
}
.inventoryTitle{
 font-size:10px;
 color:var(--muted);
 font-weight:900;
 letter-spacing:.08em;
 margin-bottom:7px;
}
.invRows{
 display:flex;
 flex-direction:column;
 gap:5px;
}
.invRow{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:11px;
 padding:5px 7px;
 background:#120c18;
 border-radius:9px;
}
.powerChips{
 display:flex;
 gap:4px;
 flex-wrap:wrap;
 justify-content:flex-end;
}
.chip{
 background:#382544;
 border:1px solid #5c3e6b;
 padding:3px 6px;
 border-radius:20px;
 font-size:9px;
 color:#e9d7ef;
}
.noPower{
 color:#67596d;
 font-size:9px;
}
.footerActions{
 display:flex;
 justify-content:center;
 gap:7px;
 margin-top:10px;
}
.footerActions button{
 font-size:10px;
 padding:8px 11px;
}
.overlay{
 position:fixed;
 inset:0;
 z-index:50;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#08050bea;
 backdrop-filter:blur(8px);
}
.overlay.hidden{display:none}
.overlayBox{
 width:min(430px,100%);
 text-align:center;
 background:#1b1122;
 border:1px solid #633b61;
 border-radius:23px;
 padding:25px 19px;
 box-shadow:0 30px 80px #000a;
}
.phaseBig{
 font-size:12px;
 color:var(--gold);
 font-weight:950;
 letter-spacing:.15em;
}
.overlayBox h2{
 font-size:28px;
 margin:8px 0;
}
.overlayBox p{
 color:#d4c3da;
 line-height:1.5;
 font-size:13px;
}
.toast{
 position:fixed;
 left:50%;
 bottom:calc(20px + env(safe-area-inset-bottom));
 transform:translateX(-50%);
 z-index:80;
 background:#27172e;
 border:1px solid #70436f;
 padding:10px 15px;
 border-radius:20px;
 font-size:11px;
 box-shadow:0 10px 30px #0008;
}
.hidden{display:none!important}
@media(max-width:430px){
 body{padding-left:8px;padding-right:8px}
 .panel{padding:11px}
 .logo{font-size:24px}
 .missionText{font-size:17px}
 .cardChoice{min-height:69px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">C<span>A</span>LOR</div>
<div class="subtitle">tensão • química • caos</div>

<section id="setup" class="screen active">
 <div class="panel">
  <h2>Nova partida</h2>

  <div class="field">
   <label>Número de jogadores</label>
   <select id="playerCount">
    <option value="4">4 jogadores</option>
    <option value="6">6 jogadores</option>
   </select>
  </div>

  <div id="playerInputs" class="playerGrid"></div>

  <div class="field">
   <label>Temperatura inicial</label>
   <select id="startTemp">
    <option value="5">🌱 Começar leve</option>
    <option value="15">😏 Já existe química</option>
    <option value="25">🔥 Começar mais quente</option>
   </select>
  </div>

  <label class="consent">
   <input type="checkbox" id="adultCheck">
   <span>
    Todos são adultos e estão participando voluntariamente.
    Qualquer jogador pode passar, pausar ou encerrar sua participação a qualquer momento.
   </span>
  </label>

  <button id="startBtn" class="full">COMEÇAR</button>
 </div>
</section>

<section id="game" class="screen">

 <div class="topbar">
  <div class="meter">
   <div class="meterHead">
    <span>🔥 TEMPERATURA</span>
    <strong id="tempValue">0</strong>
   </div>
   <div class="track">
    <div id="tempFill" class="fill"></div>
   </div>
  </div>

  <div class="meter">
   <div class="meterHead">
    <span>🌀 TENSÃO</span>
    <strong id="tensionValue">0</strong>
   </div>
   <div class="track">
    <div id="tensionFill" class="fill tensionFill"></div>
   </div>
  </div>
 </div>

 <div class="phaseBar">
  <div>
   <div id="phaseLabel" class="phaseLabel">FASE 1 / 5</div>
   <div id="phaseName" class="phaseName">🌱 Aquecimento</div>
  </div>
  <div id="roundLabel" class="round">RODADA 1</div>
 </div>

 <div class="route">
  <div class="names">
   <span id="actorName">—</span>
   <span class="arrow">→</span>
   <span id="targetName">—</span>
  </div>
  <div id="selectorName" class="selector"></div>
 </div>

 <div id="passivePower" class="powerNotice hidden">
  <strong id="passivePowerTitle">⚡ Você pode usar um poder</strong>
  <div class="small" id="passivePowerText"></div>
  <div id="passivePowerButtons" class="powerButtons"></div>
 </div>

 <div id="offerArea">
  <div class="offerTitle">
   Escolha uma carta. A missão só será revelada depois.
  </div>
  <div id="cards" class="cards"></div>
 </div>

 <div id="missionArea" class="mission hidden">
  <div id="missionCat" class="missionCat"></div>
  <div id="missionText" class="missionText"></div>

  <div class="actions">
   <button id="acceptBtn">FEITO 🔥</button>
   <button id="passBtn" class="pass">PASSAR</button>
  </div>
 </div>

 <div class="panel inventory">
  <div class="inventoryTitle">⚡ PODERES</div>
  <div id="inventory" class="invRows"></div>
 </div>

 <div class="footerActions">
  <button id="rulesBtn" class="ghost">REGRAS</button>
  <button id="pauseBtn" class="ghost">PAUSAR</button>
  <button id="endBtn" class="ghost">ENCERRAR</button>
 </div>

</section>

</div>

<div id="phaseOverlay" class="overlay hidden">
 <div class="overlayBox">
  <div id="phaseOverlayLabel" class="phaseBig">NOVA FASE</div>
  <h2 id="phaseOverlayName"></h2>
  <p id="phaseOverlayText"></p>
  <button id="phaseContinue" style="width:100%">
   ENTRAR NA NOVA FASE
  </button>
 </div>
</div>

<div id="powerOverlay" class="overlay hidden">
 <div class="overlayBox">
  <div class="phaseBig">⚡ NOVO PODER</div>
  <h2 id="powerWinner"></h2>
  <p id="powerAwardText"></p>
  <button id="powerContinue" style="width:100%">
   CONTINUAR
  </button>
 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>

let CARDS=[];
let G=null;

const $=id=>document.getElementById(id);

const PHASES=[
 {level:1,name:"🌱 Aquecimento"},
 {level:2,name:"😏 Química"},
 {level:3,name:"🔥 Desejo"},
 {level:4,name:"🫦 Intimidade"},
 {level:5,name:"🌙 Madrugada"}
];

const CATEGORY={
 flirt:["😏","Flerte"],
 confession:["🧠","Confissão"],
 proximity:["🤝","Contato"],
 kiss:["💋","Beijo"],
 undress:["👕","Desafio"],
 chaos:["🎲","Caos"]
};

const POWERS={
 SWAP:{
  name:"↻ Troca",
  description:"Troque a missão atual por outra."
 },
 REVERSE:{
  name:"⇄ Inversão",
  description:"Inverta quem é ativo e quem é passivo nesta missão."
 },
 REDIRECT:{
  name:"↗ Desvio",
  description:"Faça o jogo escolher outro alvo."
 }
};

const show=id=>{
 document.querySelectorAll(".screen")
  .forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");
};

function toast(text){
 const el=$("toast");
 el.textContent=text;
 el.classList.remove("hidden");

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  el.classList.add("hidden");
 },2200);
}

function clamp(v,min=0,max=100){
 return Math.max(min,Math.min(max,v));
}

function rand(){
 G.seed=(G.seed*1664525+1013904223)>>>0;
 return G.seed/4294967296;
}

function weighted(items,weightFn){
 const weights=items.map(x=>Math.max(.001,weightFn(x)));
 const total=weights.reduce((a,b)=>a+b,0);

 let r=rand()*total;

 for(let i=0;i<items.length;i++){
  r-=weights[i];
  if(r<=0)return items[i];
 }

 return items[items.length-1];
}

function pairKey(a,b){
 return [a.id,b.id].sort().join("_");
}

function pairStats(a,b){
 const key=pairKey(a,b);

 if(!G.pairs[key]){
  G.pairs[key]={
   total:0,
   lastRound:-999,
   directions:{}
  };
 }

 return G.pairs[key];
}

function directionKey(a,b){
 return a.id+">"+b.id;
}

function setupPlayerInputs(){
 const n=+$("playerCount").value;
 const box=$("playerInputs");

 box.innerHTML="";

 for(let i=0;i<n;i++){
  const input=document.createElement("input");
  input.placeholder="Jogador "+(i+1);
  input.id="p"+i;
  input.value="";
  box.appendChild(input);
 }
}

$("playerCount").addEventListener("change",setupPlayerInputs);
setupPlayerInputs();

function createGame(){
 const n=+$("playerCount").value;
 const players=[];

 for(let i=0;i<n;i++){
  const name=$("p"+i).value.trim() || "Jogador "+(i+1);

  players.push({
   id:"P"+(i+1),
   name,
   activeTurns:0,
   targetedTurns:0,
   accepted:0,
   declined:0,
   powers:[]
  });
 }

 return {
  version:"0.5.0",
  seed:(Date.now()>>>0),
  round:1,
  temperature:+$("startTemp").value,
  tension:5,
  level:1,
  previousLevel:1,
  players,
  pairs:{},
  usedCards:[],
  recentPairs:[],
  current:null,
  selectorIndex:0,
  paused:false
 };
}

function startGame(){
 if(!$("adultCheck").checked){
  alert("Confirme que todos são adultos e estão participando voluntariamente.");
  return;
 }

 if(!CARDS.length){
  alert("O baralho ainda não foi carregado.");
  return;
 }

 G=createGame();
 saveGame();
 show("game");
 updateUI();
 nextRound();
}

$("startBtn").addEventListener("click",startGame);

function determineLevel(){
 const t=G.temperature;
 const s=G.tension;

 let level=1;

 const combined=(t+s)/2;

 if(combined>=20 || (t>=25&&s>=15)) level=2;
 if(combined>=38 || (t>=45&&s>=28)) level=3;
 if(combined>=58 || (t>=65&&s>=45)) level=4;
 if(combined>=78 || (t>=82&&s>=65)) level=5;

 if(t>=70&&s>=70)level=Math.max(level,4);
 if(t>=88&&s>=80)level=5;

 return clamp(level,1,5);
}

function updatePhase(){
 const old=G.level;
 const next=determineLevel();

 G.previousLevel=old;
 G.level=next;

 if(next>old){
  showPhaseTransition(old,next);
 }
}

function showPhaseTransition(oldLevel,newLevel){
 const phase=PHASES[newLevel-1];

 $("phaseOverlayLabel").textContent=
  newLevel-oldLevel>1
   ? "🔥 O JOGO PULOU UMA ETAPA"
   : "🔥 NOVA FASE";

 $("phaseOverlayName").textContent=phase.name;

 let text="Temperatura e Tensão levaram o jogo para a Fase "+newLevel+".";

 if(newLevel===2)
  text+=" A química começa a sair da conversa e aparecer no corpo.";

 if(newLevel===3)
  text+=" As interações passam a ser mais físicas e podem continuar além de uma única rodada.";

 if(newLevel===4)
  text+=" O jogo entra em uma zona de maior proximidade, provocação e continuidade.";

 if(newLevel===5)
  text+=" O jogo chegou à intensidade máxima. A partir daqui, a dinâmica do grupo é mais importante que acelerar os índices.";

 $("phaseOverlayText").textContent=text;
 $("phaseOverlay").classList.remove("hidden");
}

$("phaseContinue").addEventListener("click",()=>{
 $("phaseOverlay").classList.add("hidden");
 updateUI();
});

function actorScore(p){
 const min=Math.min(...G.players.map(x=>x.activeTurns));
 return 1+(min-p.activeTurns+2)*2;
}

function selectActor(){
 return weighted(G.players,actorScore);
}

function targetScore(actor,target){
 if(actor.id===target.id)return 0;

 const pair=pairStats(actor,target);

 let score=1;

 score*=1/(1+pair.total*pair.total);

 const roundsSince=G.round-pair.lastRound;

 if(roundsSince<=2)score*=.03;
 else if(roundsSince===3)score*=.15;
 else if(roundsSince===4)score*=.45;

 const minTarget=Math.min(
  ...G.players
   .filter(p=>p.id!==actor.id)
   .map(p=>p.targetedTurns)
 );

 if(target.targetedTurns===minTarget)score*=2;

 const dir=directionKey(actor,target);
 const reverse=directionKey(target,actor);

 const dirCount=pair.directions[dir]||0;
 const reverseCount=pair.directions[reverse]||0;

 if(dirCount>reverseCount)score*=.55;
 if(dirCount<reverseCount)score*=1.35;

 return score;
}

function selectTarget(actor){
 const candidates=G.players.filter(p=>p.id!==actor.id);
 return weighted(candidates,p=>targetScore(actor,p));
}

function availableCards(){
 let candidates=CARDS.filter(c=>
  c.level<=G.level &&
  (!c.requirements?.minPlayers ||
   c.requirements.minPlayers<=G.players.length)
 );

 const recent=new Set(G.usedCards.slice(-10));

 const fresh=candidates.filter(c=>!recent.has(c.id));

 if(fresh.length>=3)candidates=fresh;

 return candidates;
}

function chooseThreeCards(){
 let pool=[...availableCards()];
 const chosen=[];
 const cats=new Set();

 while(pool.length && chosen.length<3){
  let candidates=pool.filter(c=>!cats.has(c.category));

  if(!candidates.length)candidates=pool;

  const c=weighted(candidates,x=>{
   let w=x.weight||1;

   if(x.level===G.level)w*=2.3;

   if(G.level>=3 &&
      ["proximity","kiss","undress"].includes(x.category)){
    w*=1.8;
   }

   if(x.category==="confession" && G.level>=3){
    w*=.35;
   }

   return w;
  });

  chosen.push(c);
  cats.add(c.category);
  pool=pool.filter(x=>x.id!==c.id);
 }

 return chosen;
}

function nextRound(){
 if(!G || G.paused)return;

 const actor=selectActor();
 const target=selectTarget(actor);

 actor.activeTurns++;
 target.targetedTurns++;

 const selector=
  G.players[G.selectorIndex % G.players.length];

 G.selectorIndex++;

 G.current={
  actorId:actor.id,
  targetId:target.id,
  selectorId:selector.id,
  options:chooseThreeCards(),
  selected:null
 };

 renderRound();
 saveGame();
}

function getPlayer(id){
 return G.players.find(p=>p.id===id);
}

function renderRound(){
 const actor=getPlayer(G.current.actorId);
 const target=getPlayer(G.current.targetId);
 const selector=getPlayer(G.current.selectorId);

 $("actorName").textContent=actor.name;
 $("targetName").textContent=target.name;

 $("selectorName").textContent=
  selector.name+" escolhe a carta";

 $("roundLabel").textContent=
  "RODADA "+G.round;

 renderChoices();
 renderPassivePowers();
 renderInventory();

 $("missionArea").classList.add("hidden");
 $("offerArea").classList.remove("hidden");

 updateUI();
}

function intensityLabel(v){
 if(v<25)return "leve";
 if(v<50)return "média";
 if(v<75)return "alta";
 return "intensa";
}

function renderChoices(){
 const box=$("cards");
 box.innerHTML="";

 G.current.options.forEach((card,index)=>{
  const info=CATEGORY[card.category]||["🔥","Missão"];

  const el=document.createElement("div");
  el.className="cardChoice";

  el.innerHTML=
   '<div class="emoji">'+info[0]+'</div>'+
   '<div class="cat">'+(index+1)+" · "+info[1]+'</div>'+
   '<div class="intensity">'+
   intensityLabel(card.intensity)+
   "</div>";

  el.onclick=()=>selectCard(index);

  box.appendChild(el);
 });
}

function selectCard(index){
 const card=G.current.options[index];
 G.current.selected=card;

 const actor=getPlayer(G.current.actorId);
 const target=getPlayer(G.current.targetId);

 const info=CATEGORY[card.category]||["🔥","Missão"];

 $("missionCat").textContent=
  info[0]+" "+info[1]+" · FASE "+card.level;

 let text=card.text.ptBR;

 text=text
  .replace(/\bA\b/g,actor.name)
  .replace(/\bB\b/g,target.name);

 $("missionText").textContent=text;

 $("offerArea").classList.add("hidden");
 $("missionArea").classList.remove("hidden");

 renderPassivePowers();
 saveGame();
}

function recordPair(){
 const actor=getPlayer(G.current.actorId);
 const target=getPlayer(G.current.targetId);

 const pair=pairStats(actor,target);

 pair.total++;
 pair.lastRound=G.round;

 const dir=directionKey(actor,target);
 pair.directions[dir]=(pair.directions[dir]||0)+1;

 G.recentPairs.push(pairKey(actor,target));

 if(G.recentPairs.length>8)G.recentPairs.shift();
}

function resolveAccepted(){
 if(!G.current.selected)return;

 const card=G.current.selected;
 const actor=getPlayer(G.current.actorId);

 actor.accepted++;

 G.temperature=clamp(
  G.temperature+(card.temperatureDelta||1)
 );

 G.tension=clamp(
  G.tension+(card.tensionDelta||1)
 );

 G.usedCards.push(card.id);

 recordPair();

 const oldLevel=G.level;

 G.round++;

 updatePhase();
 saveGame();

 if(G.level===oldLevel){
  nextRound();
 }
}

$("acceptBtn").addEventListener("click",resolveAccepted);

function randomPower(){
 const ids=Object.keys(POWERS);
 return ids[Math.floor(rand()*ids.length)];
}

function awardPower(player){
 const powerId=randomPower();

 player.powers.push({
  id:powerId,
  earnedRound:G.round
 });

 $("powerWinner").textContent=
  player.name+" ganhou "+POWERS[powerId].name;

 $("powerAwardText").textContent=
  POWERS[powerId].description+
  " O poder ficará guardado até ser usado.";

 $("powerOverlay").classList.remove("hidden");

 renderInventory();
 saveGame();
}

function resolvePass(){
 if(!G.current.selected)return;

 const actor=getPlayer(G.current.actorId);

 actor.declined++;

 G.tension=clamp(G.tension+2);

 recordPair();

 awardPower(actor);
}

$("passBtn").addEventListener("click",resolvePass);

$("powerContinue").addEventListener("click",()=>{
 $("powerOverlay").classList.add("hidden");

 const oldLevel=G.level;

 G.round++;
 updatePhase();
 saveGame();

 if(G.level===oldLevel){
  nextRound();
 }
});

function renderPassivePowers(){
 if(!G?.current)return;

 const target=getPlayer(G.current.targetId);
 const box=$("passivePower");

 if(!target.powers.length){
  box.classList.add("hidden");
  return;
 }

 box.classList.remove("hidden");

 $("passivePowerTitle").textContent=
  "⚡ "+target.name+", você pode usar um poder";

 $("passivePowerText").textContent=
  "Você é o jogador passivo desta interação.";

 const buttons=$("passivePowerButtons");
 buttons.innerHTML="";

 target.powers.forEach((power,index)=>{
  const data=POWERS[power.id];

  const btn=document.createElement("button");
  btn.textContent=data.name;

  btn.onclick=()=>usePower(target,index);

  buttons.appendChild(btn);
 });
}

function usePower(player,index){
 const power=player.powers[index];

 if(!power)return;

 if(power.id==="SWAP"){
  useSwap(player,index);
  return;
 }

 if(power.id==="REVERSE"){
  useReverse(player,index);
  return;
 }

 if(power.id==="REDIRECT"){
  useRedirect(player,index);
  return;
 }
}

function consumePower(player,index){
 player.powers.splice(index,1);
 renderInventory();
 renderPassivePowers();
 saveGame();
}

function useSwap(player,index){
 const current=G.current.selected;

 let pool=availableCards().filter(c=>
  !current || c.id!==current.id
 );

 if(!pool.length)return;

 const replacement=
  pool[Math.floor(rand()*pool.length)];

 G.current.selected=replacement;

 consumePower(player,index);

 if(!$("missionArea").classList.contains("hidden")){
  const actor=getPlayer(G.current.actorId);
  const target=getPlayer(G.current.targetId);
  const info=CATEGORY[replacement.category]||["🔥","Missão"];

  $("missionCat").textContent=
   info[0]+" "+info[1]+" · FASE "+replacement.level;

  $("missionText").textContent=
   replacement.text.ptBR
    .replace(/\bA\b/g,actor.name)
    .replace(/\bB\b/g,target.name);
 }

 toast(player.name+" usou ↻ Troca");
}

function useReverse(player,index){
 const oldActor=G.current.actorId;

 G.current.actorId=G.current.targetId;
 G.current.targetId=oldActor;

 consumePower(player,index);

 toast(player.name+" usou ⇄ Inversão");
 renderRound();

 if(G.current.selected){
  const selected=G.current.selected;
  G.current.selected=null;

  const idx=G.current.options
   .findIndex(c=>c.id===selected.id);

  if(idx>=0)selectCard(idx);
 }
}

function useRedirect(player,index){
 const actor=getPlayer(G.current.actorId);

 const oldTarget=G.current.targetId;

 const candidates=G.players.filter(p=>
  p.id!==actor.id &&
  p.id!==oldTarget
 );

 if(!candidates.length)return;

 const newTarget=weighted(
  candidates,
  p=>targetScore(actor,p)
 );

 G.current.targetId=newTarget.id;

 consumePower(player,index);

 toast(player.name+" usou ↗ Desvio");

 renderRound();
}

function renderInventory(){
 if(!G)return;

 const box=$("inventory");
 box.innerHTML="";

 G.players.forEach(player=>{
  const row=document.createElement("div");
  row.className="invRow";

  const name=document.createElement("strong");
  name.textContent=player.name;

  const powers=document.createElement("div");
  powers.className="powerChips";

  if(!player.powers.length){
   powers.innerHTML='<span class="noPower">sem poderes</span>';
  }else{
   player.powers.forEach(p=>{
    const chip=document.createElement("span");
    chip.className="chip";
    chip.textContent=POWERS[p.id]?.name||p.id;
    powers.appendChild(chip);
   });
  }

  row.appendChild(name);
  row.appendChild(powers);

  box.appendChild(row);
 });
}

function updateUI(){
 if(!G)return;

 $("tempValue").textContent=Math.round(G.temperature);
 $("tensionValue").textContent=Math.round(G.tension);

 $("tempFill").style.width=
  clamp(G.temperature)+"%";

 $("tensionFill").style.width=
  clamp(G.tension)+"%";

 const phase=PHASES[G.level-1];

 $("phaseLabel").textContent=
  "FASE "+G.level+" / 5";

 $("phaseName").textContent=
  phase.name;

 renderInventory();
}

function saveGame(){
 if(!G)return;

 try{
  localStorage.setItem(
   "calorGame",
   JSON.stringify(G)
  );
 }catch(e){}
}

$("pauseBtn").addEventListener("click",()=>{
 if(!G)return;

 G.paused=!G.paused;

 $("pauseBtn").textContent=
  G.paused ? "RETOMAR" : "PAUSAR";

 if(G.paused){
  toast("Jogo pausado");
 }else{
  toast("Jogo retomado");
 }

 saveGame();
});

$("endBtn").addEventListener("click",()=>{
 if(!G)return;

 if(confirm("Encerrar esta partida?")){
  localStorage.removeItem("calorGame");
  G=null;
  show("setup");
 }
});

$("rulesBtn").addEventListener("click",()=>{
 alert(
`CALOR

• Todos os participantes são adultos e entram voluntariamente no jogo.

• O app define quem interage com quem.

• Quem escolhe a carta não escolhe os participantes.

• A carta só é revelada depois da escolha.

• PASSAR está sempre disponível.

• Se uma missão for passada, o jogador ativo recebe um poder.

• Os poderes ficam guardados no inventário de cada jogador.

• Quando alguém com poderes aparece como alvo/passivo, o app destaca que um poder pode ser usado.

• ↻ TROCA substitui a missão atual.

• ⇄ INVERSÃO troca o jogador ativo e o passivo.

• ↗ DESVIO faz o algoritmo escolher outro alvo.

• Temperatura e Tensão determinam a fase do jogo.

• Os índices podem fazer o jogo avançar mais rapidamente e até pular uma etapa.

• As fases mais avançadas aumentam a frequência e a continuidade das interações físicas.

• Qualquer participante pode passar, pausar ou encerrar sua participação a qualquer momento.

• A partida não termina automaticamente quando os índices chegam a 100. O grupo decide quando terminar.`
 );
});

async function loadCards(){
 try{
  const response=await fetch(
   "./cards.json",
   {cache:"no-store"}
  );

  if(!response.ok){
   throw new Error("cards.json");
  }

  const data=await response.json();

  if(!Array.isArray(data) || !data.length){
   throw new Error("Baralho vazio");
  }

  CARDS=data;

 }catch(error){
  console.error(error);

  alert(
   "Não foi possível carregar cards.json. "+
   "Verifique se ele está na raiz do site junto com index.html."
  );
 }
}

loadCards();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker
   .register("./service-worker.js")
   .catch(console.error);
 });
}

</script>

</body>
</html>
