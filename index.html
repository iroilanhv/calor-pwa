<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b18"><link rel="manifest" href="./manifest.webmanifest"><title>CALOR — Board Mode</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0812;color:#f7effb;font-family:-apple-system,sans-serif;padding:12px}.wrap{max-width:620px;margin:auto}.logo{text-align:center;font-size:28px;font-weight:950;letter-spacing:.12em;margin:8px}.logo b{color:#ff4d7d}.panel,.meter,.phase,.mission{background:#17101f;border:1px solid #392643;border-radius:16px;padding:12px;margin:8px 0}.hidden{display:none!important}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px;font-weight:850;color:#fff;background:linear-gradient(135deg,#ff4d7d,#9c45ff)}input,select{width:100%;padding:11px;margin:4px 0;border-radius:11px;border:1px solid #392643;background:#110b17;color:#fff}.grid,.players,.actions,.top{display:grid;grid-template-columns:1fr 1fr;gap:7px}.players button{min-height:62px}.mh,.phase,.invrow{display:flex;justify-content:space-between;align-items:center;font-size:11px}.track{height:5px;background:#302139;border-radius:8px;margin-top:5px}.fill{height:100%;background:#ff4d7d}.tf{background:#a45cff}.route{text-align:center;font-size:21px;font-weight:900;padding:10px}.route i{color:#ff4d7d;font-style:normal;margin:0 8px}.mission{text-align:center;background:#211424}.cat{color:#ffcc70;font-size:10px;font-weight:900}.text{font-size:18px;font-weight:850;line-height:1.35;margin:9px 0}.drink{background:#302438;border:1px solid #5b4866}.power{background:#2a1d13;border:1px solid #805c27;border-radius:13px;padding:10px;margin:8px 0}.pbuttons{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pbuttons button{font-size:10px;padding:7px;background:#50391b}.chip{font-size:9px;background:#382544;padding:3px 6px;border-radius:12px;margin-left:3px}.overlay{position:fixed;inset:0;background:#08050bea;display:flex;align-items:center;justify-content:center;padding:20px}.box{max-width:420px;background:#1b1122;border:1px solid #633b61;border-radius:22px;padding:22px;text-align:center}.full{width:100%}</style></head><body><div class="wrap"><div class="logo">C<b>A</b>LOR</div>
<section id="setup"><div class="panel"><h3>Board Mode</h3><select id="count"><option>4</option><option>6</option></select><div id="names" class="grid"></div><select id="startTemp"><option value="5">🌱 Leve</option><option value="20">😏 Química</option><option value="40">🔥 Fase 3</option></select><label style="display:flex;gap:7px;font-size:11px;margin:10px 0"><input style="width:auto" type="checkbox" id="adult"> Todos são adultos e participam voluntariamente.</label><button id="start" class="full">COMEÇAR</button></div></section>
<section id="game" class="hidden"><div class="top"><div class="meter"><div class="mh"><span>🔥 TEMPERATURA</span><b id="tv"></b></div><div class="track"><div id="tfill" class="fill"></div></div></div><div class="meter"><div class="mh"><span>🌀 TENSÃO</span><b id="sv"></b></div><div class="track"><div id="sfill" class="fill tf"></div></div></div></div><div class="phase"><b id="phaseName"></b><span id="pc"></span></div>
<div id="chooser" class="panel"><p style="text-align:center;color:#b8a9c1">Quem perdeu no jogo externo?</p><div id="playerButtons" class="players"></div></div>
<div id="penalty" class="hidden"><div class="route"><span id="an"></span><i>→</i><span id="bn"></span></div><div id="power" class="power hidden"><b id="pt"></b><div id="pb" class="pbuttons"></div></div><div class="mission"><div id="cat" class="cat"></div><div id="text" class="text"></div><div class="actions"><button id="done">FEITO 🔥</button><button id="drink" class="drink">BEBER 🥃</button></div></div></div>
<div class="panel"><small>⚡ PODERES</small><div id="inventory"></div></div><button id="end" class="full" style="background:#302438">ENCERRAR</button></section></div>
<div id="overlay" class="overlay hidden"><div class="box"><h2 id="ot"></h2><p id="ox"></p><button id="ok" class="full">CONTINUAR</button></div></div>
<script>
let C=[],G;const $=x=>document.getElementById(x),P=["🌱 Aquecimento","😏 Química","🔥 Desejo","🫦 Intimidade","🌙 Madrugada"],PW={REVERSE:"⇄ Inversão",REDIRECT:"↗ Desvio",REROLL:"↻ Nova carta"};
function inputs(){names.innerHTML="";for(let i=0;i<+count.value;i++){let x=document.createElement("input");x.id="p"+i;x.placeholder="Jogador "+(i+1);names.appendChild(x)}}count.onchange=inputs;inputs();
function rnd(){G.seed=(G.seed*1664525+1013904223)>>>0;return G.seed/4294967296}function w(a,f){let q=a.map(x=>Math.max(.001,f(x))),t=q.reduce((a,b)=>a+b),r=rnd()*t;for(let i=0;i<a.length;i++){r-=q[i];if(r<=0)return a[i]}return a.at(-1)}
function pl(id){return G.players.find(x=>x.id===id)}function key(a,b){return[a.id,b.id].sort().join("_")}function st(a,b){return G.pairs[key(a,b)]||(G.pairs[key(a,b)]={n:0,last:-99,dir:{}})}function dk(a,b){return a.id+">"+b.id}
function level(){let c=(G.temperature+G.tension)/2;return c>=78?5:c>=58?4:c>=38?3:c>=20?2:1}function update(){let old=G.level;G.level=level();tv.textContent=G.temperature;sv.textContent=G.tension;tfill.style.width=G.temperature+"%";sfill.style.width=G.tension+"%";phaseName.textContent="FASE "+G.level+"/5 · "+P[G.level-1];pc.textContent=G.penalties+" penalidades";inventory.innerHTML=G.players.map(p=>'<div class="invrow"><b>'+p.name+'</b><span>'+(p.powers.map(x=>'<i class="chip">'+PW[x]+'</i>').join("")||"—")+"</span></div>").join("");if(G.level>old){ot.textContent=P[G.level-1];ox.textContent="A próxima penalidade já usa a nova fase.";overlay.classList.remove("hidden")}}
function score(a,b){let s=st(a,b),z=1/(1+s.n*s.n),d=s.dir[dk(a,b)]||0,r=s.dir[dk(b,a)]||0;if(G.penalties-s.last<2)z*=.08;if(d>r)z*=.55;if(d<r)z*=1.4;return z/(1+b.benefits*.18)}
function target(a){return w(G.players.filter(x=>x.id!==a.id),b=>score(a,b))}function card(a,b,ex){let pool=C.filter(c=>c.level<=G.level&&c.id!==ex);return w(pool,c=>(c.level===G.level?2:1)/(1+(a.cards[c.id]||0)*.8+(b.cards[c.id]||0)*.55+(G.cc[c.id]||0)*.12))}
function buttons(){playerButtons.innerHTML="";G.players.forEach(p=>{let b=document.createElement("button");b.textContent=p.name;b.onclick=()=>pick(p);playerButtons.appendChild(b)})}function pick(a){let b=target(a);G.current={a:a.id,b:b.id,c:card(a,b)};a.losses++;b.benefits++;render()}
function render(){let a=pl(G.current.a),b=pl(G.current.b),c=G.current.c;an.textContent=a.name;bn.textContent=b.name;text.textContent=c.text.ptBR.replace(/\bA\b/g,a.name).replace(/\bB\b/g,b.name);cat.textContent="FASE "+c.level+" · "+c.category.toUpperCase();chooser.classList.add("hidden");penalty.classList.remove("hidden");if(b.powers.length){power.classList.remove("hidden");pt.textContent="⚡ "+b.name+", você pode usar um poder";pb.innerHTML="";b.powers.forEach((x,i)=>{let q=document.createElement("button");q.textContent=PW[x];q.onclick=()=>use(b,i);pb.appendChild(q)})}else power.classList.add("hidden")}
function use(o,i){let x=o.powers[i];if(x==="REVERSE"){[G.current.a,G.current.b]=[G.current.b,G.current.a]}else if(x==="REDIRECT"){G.current.b=target(pl(G.current.a)).id}else G.current.c=card(pl(G.current.a),pl(G.current.b),G.current.c.id);o.powers.splice(i,1);render();update()}
function finish(dr){let a=pl(G.current.a),b=pl(G.current.b),c=G.current.c,s=st(a,b);s.n++;s.last=G.penalties;s.dir[dk(a,b)]=(s.dir[dk(a,b)]||0)+1;a.cards[c.id]=(a.cards[c.id]||0)+1;b.cards[c.id]=(b.cards[c.id]||0)+1;G.cc[c.id]=(G.cc[c.id]||0)+1;G.penalties++;if(dr){G.tension=Math.min(100,G.tension+1);let x=Object.keys(PW)[Math.floor(rnd()*3)];b.powers.push(x);ot.textContent=b.name+" ganhou "+PW[x];ox.textContent="O poder ficou guardado para uma próxima penalidade."}else{G.temperature=Math.min(100,G.temperature+(c.temperatureDelta||1));G.tension=Math.min(100,G.tension+(c.tensionDelta||1))}G.current=null;penalty.classList.add("hidden");chooser.classList.remove("hidden");update();buttons();if(dr)overlay.classList.remove("hidden");localStorage.setItem("calorBoard",JSON.stringify(G))}
done.onclick=()=>finish(false);drink.onclick=()=>finish(true);ok.onclick=()=>overlay.classList.add("hidden");start.onclick=()=>{if(!adult.checked)return alert("Confirme a participação voluntária.");let ps=[];for(let i=0;i<+count.value;i++)ps.push({id:"P"+(i+1),name:$("p"+i).value.trim()||"Jogador "+(i+1),losses:0,benefits:0,powers:[],cards:{},clothing:4});G={seed:Date.now()>>>0,temperature:+startTemp.value,tension:5,level:1,penalties:0,players:ps,pairs:{},cc:{}};setup.classList.add("hidden");game.classList.remove("hidden");update();buttons()};end.onclick=()=>{if(confirm("Encerrar?")){localStorage.removeItem("calorBoard");location.reload()}};fetch("./cards.json",{cache:"no-store"}).then(r=>r.json()).then(x=>C=x).catch(()=>alert("Erro ao carregar cards.json"));if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script></body></html>
