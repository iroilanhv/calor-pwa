<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b18"><link rel="manifest" href="./manifest.webmanifest"><title>CALOR — Board Mode 0.8</title>
<style>
*{box-sizing:border-box}:root{--bg:#0d0812;--p:#17101f;--b:#392643;--mut:#b8a9c1;--hot:#ff4d7d;--gold:#ffcc70}
body{margin:0;background:radial-gradient(circle at 15% 0,#32133b 0,transparent 34%),var(--bg);color:#f7effb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:650px;margin:auto}.logo{text-align:center;font-size:28px;font-weight:950;letter-spacing:.13em;margin:6px}.logo b{color:var(--hot)}.ver{text-align:center;color:var(--mut);font-size:10px}.panel,.meter,.phase,.mission{background:#17101fee;border:1px solid var(--b);border-radius:16px;padding:12px;margin:8px 0}.hidden{display:none!important}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px;font-weight:850;color:#fff;background:linear-gradient(135deg,#ff4d7d,#9c45ff)}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--b);background:#110b17;color:#fff}.grid,.players,.actions,.top,.dash{display:grid;grid-template-columns:1fr 1fr;gap:7px}.players button{min-height:68px}.mh,.row,.phase{display:flex;justify-content:space-between;align-items:center;font-size:11px;gap:8px}.track{height:6px;background:#302139;border-radius:8px;margin-top:5px;overflow:hidden}.fill{height:100%;background:#ff4d7d}.tf{background:#a45cff}.pf{background:#ffcc70}.route{text-align:center;font-size:21px;font-weight:950;padding:9px}.route i{font-style:normal;color:var(--hot);margin:0 8px}.mission{text-align:center;background:#211424}.cat{font-size:10px;color:var(--gold);font-weight:900}.text{font-size:18px;font-weight:850;line-height:1.35;margin:9px 0}.drink{background:#302438;border:1px solid #5b4866}.power{background:#2a1d13;border:1px solid #805c27;border-radius:13px;padding:9px;margin:8px 0}.pbuttons{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pbuttons button{font-size:10px;padding:7px;background:#50391b}.chip{font-size:9px;background:#382544;padding:3px 6px;border-radius:12px;margin-left:3px}.title{font-size:11px;font-weight:900;color:var(--gold);margin-bottom:7px}.rank1{color:#ffdc83}.cloth{font-size:12px;white-space:nowrap}.loss{font-size:11px;color:#ffd08b}.small{font-size:10px;color:var(--mut)}.overlay{position:fixed;inset:0;z-index:50;background:#08050bea;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(430px,100%);background:#1b1122;border:1px solid #633b61;border-radius:22px;padding:22px;text-align:center}.winner{font-size:48px}.full{width:100%}.phaseInfo{flex:1}.phaseInfo b{color:var(--gold)}.phaseInfo .track{margin-top:7px}.statnum{font-size:17px;font-weight:950}
</style></head><body><div class="wrap"><div class="logo">C<b>A</b>LOR</div><div class="ver">BOARD MODE 0.8.3 • progressão de roupa ajustada</div>
<section id="setup"><div class="panel"><h3>Configurar partida</h3><select id="count"><option value="4">4 jogadores</option><option value="6">6 jogadores</option></select><div id="names" class="grid" style="margin:8px 0"></div><label class="small">Peças de roupa iniciais por jogador</label><select id="pieces"><option value="4" selected>4 peças</option><option value="5">5 peças</option><option value="6">6 peças</option></select><label style="display:flex;gap:7px;font-size:11px;margin:10px 0"><input style="width:auto" type="checkbox" id="adult"> Todos são adultos e participam voluntariamente.</label><button id="start" class="full">COMEÇAR</button></div></section>
<section id="game" class="hidden">
<div class="top"><div class="meter"><div class="mh"><span>🔥 TEMPERATURA</span><b id="tv"></b></div><div class="track"><div id="tfill" class="fill"></div></div></div><div class="meter"><div class="mh"><span>🌀 TENSÃO</span><b id="sv"></b></div><div class="track"><div id="sfill" class="fill tf"></div></div></div></div>
<div class="phase"><div class="phaseInfo"><b id="phaseName"></b><div id="phaseHint" class="small"></div><div class="track"><div id="phaseFill" class="fill pf"></div></div></div><span id="pc" class="statnum"></span></div>
<div class="dash"><div class="panel"><div class="title">🏆 PERDAS NO BOARD</div><div id="ranking"></div></div><div class="panel"><div class="title">👕 PEÇAS RESTANTES</div><div id="clothing"></div></div></div>
<div id="chooser" class="panel"><p style="text-align:center;color:#b8a9c1">Quem perdeu no jogo externo?</p><div id="playerButtons" class="players"></div></div>
<div id="penalty" class="hidden"><div class="route"><span id="an"></span><i>→</i><span id="bn"></span></div><div id="power" class="power hidden"><b id="pt"></b><div id="pb" class="pbuttons"></div></div><div class="mission"><div id="cat" class="cat"></div><div id="text" class="text"></div><div class="actions"><button id="done">FEITO 🔥</button><button id="drink" class="drink">BEBER 🥃</button></div></div></div>
<div class="panel"><div class="title">⚡ PODERES</div><div id="inventory"></div></div><button id="end" class="full" style="background:#302438">ENCERRAR E VER RANKING</button></section></div>
<div id="overlay" class="overlay hidden"><div class="box"><div id="oi" class="winner"></div><h2 id="ot"></h2><p id="ox"></p><button id="ok" class="full">CONTINUAR</button></div></div>
<script>
let C=[],G;const $=x=>document.getElementById(x),P=["🌱 Quebrando o Gelo","😏 Subindo a Temperatura","🔥 Contato Direto","🫦 Pegando Fogo","🌙 Tudo Liberado"],PW={REVERSE:"⇄ Inversão",REDIRECT:"↗ Desvio",REROLL:"↻ Nova carta"};
// Mínimo de penalidades concluídas para ENTRAR em cada fase. Impede saltos e avanço rápido.
const PHASE_MIN_4=[8,12,18,16,0];
const PHASE_MIN_6=[10,14,24,20,0];
function phaseMins(){return G.players.length>=6?PHASE_MIN_6:PHASE_MIN_4}
function inputs(){names.innerHTML="";for(let i=0;i<+count.value;i++){let x=document.createElement("input");x.id="p"+i;x.placeholder="Jogador "+(i+1);names.appendChild(x)}}count.onchange=inputs;inputs();
function rnd(){G.seed=(G.seed*1664525+1013904223)>>>0;return G.seed/4294967296}
function w(a,f){let q=a.map(x=>Math.max(.001,f(x))),t=q.reduce((x,y)=>x+y,0),r=rnd()*t;for(let i=0;i<a.length;i++){r-=q[i];if(r<=0)return a[i]}return a.at(-1)}
function pl(id){return G.players.find(x=>x.id===id)}function key(a,b){return[a.id,b.id].sort().join("_")}function st(a,b){return G.pairs[key(a,b)]||(G.pairs[key(a,b)]={n:0,last:-99,dir:{}})}function dk(a,b){return a.id+">"+b.id}
function desiredClothes(){
 let mins=phaseMins(),elapsed=G.penalties-G.phaseStartedAt,need=Math.max(1,mins[G.level-1]||1),p=Math.max(0,Math.min(1,elapsed/need));
 if(G.level===1)return G.initialPieces;
 if(G.level===2)return Math.max(2,G.initialPieces-(0.5+1.25*p));
 if(G.level===3)return Math.max(1,3-2*p);
 if(G.level===4)return 0;
 return -1
}
function clothingReadyFor4(){
 let atOne=G.players.filter(p=>p.clothing<=1).length;
 let ratio=atOne/G.players.length;
 let max=Math.max(...G.players.map(p=>p.clothing));
 return ratio>=0.75&&max<=2
}
function phaseEligible(next){
 if(next>5)return false;
 let mins=phaseMins(),elapsed=G.penalties-G.phaseStartedAt;
 if(elapsed<mins[G.level-1])return false;
 if(next===4&&!clothingReadyFor4())return false;
 return true
}
// A fase nunca regride; cada nova fase começa seu próprio relógio.
function updatePhase(){
 let old=G.level,next=old+1;
 if(phaseEligible(next)){G.level=next;G.phaseStartedAt=G.penalties}
 if(G.level>old){
   oi.textContent="🔥";ot.textContent=P[G.level-1];
   ox.textContent=G.level===3
    ?"A retirada de roupa acelera gradualmente nesta fase. A Fase 4 pode começar quando a maior parte do grupo já está com 1 peça, e a retirada continua nas fases seguintes."
    :"Esta fase tem duração mínima própria antes do próximo avanço.";
   overlay.classList.remove("hidden")
 }
}
function targetScore(a,b){let s=st(a,b),z=1/(1+s.n*s.n),d=s.dir[dk(a,b)]||0,r=s.dir[dk(b,a)]||0;if(G.penalties-s.last<2)z*=.08;if(d>r)z*=.55;if(d<r)z*=1.4;return z/(1+b.benefits*.18)}
function target(a){return w(G.players.filter(x=>x.id!==a.id),b=>targetScore(a,b))}
function compatible(c,a,b){let r=c.clothingRequirement||"none";if(["none","restores_a","removes_a","requires_b_feet"].includes(r))return true;if(r==="requires_b_torso_access")return b.clothing<=3;if(r==="requires_a_lower_exposed")return a.clothing<=0;if(r==="requires_b_lower_access")return b.clothing<=2;if(r==="requires_b_lower_exposed")return b.clothing<=0;if(r==="requires_a_lower_exposed_and_b_lower_exposed")return a.clothing<=0&&b.clothing<=0;if(r==="requires_group_lower_exposed")return G.players.every(p=>p.clothing<=0);if(r==="requires_a_lower_exposed_and_group_lower_exposed")return a.clothing<=0&&G.players.every(p=>p.clothing<=0);return true}
function clothingMult(c,a){
 if(c.category!=="clothing_remove")return 1;
 let mins=phaseMins(),elapsed=G.penalties-G.phaseStartedAt,need=Math.max(1,mins[G.level-1]||1);
 let progress=Math.max(0,Math.min(1,elapsed/need));
 let gap=a.clothing-desiredClothes(),m=1;
 if(G.level===2)m=2.1+Math.max(0,gap)*1.0+progress*0.9;
 if(G.level===3){
   m=3.0+progress*3.5+Math.max(0,gap)*(1.7+progress*1.8);
   if(a.clothing>=3&&progress>0.6)m*=1.7;
   if(a.clothing===2&&progress>0.8)m*=1.35
 }
 if(G.level===4){
   m=1.25;
   if(a.clothing>=2)m*=2.8;
   else if(a.clothing===1)m*=2.2;
   else if(a.clothing===0)m*=1.1;
   else if(a.clothing===-1)m*=0.55;
   else if(a.clothing<=-2)m*=0.12
 }
 if(G.level===5){
   m=0.75;
   if(a.clothing>=1)m*=2.0;
   else if(a.clothing===0)m*=1.25;
   else if(a.clothing===-1)m*=0.65;
   else if(a.clothing<=-2)m*=0.10
 }
 return m
}
function cardScore(c,a,b){let sa=a.cards[c.id]||0,sb=b.cards[c.id]||0,g=G.cc[c.id]||0,v=(c.weight||1)/(1+sa*.75+sb*.45+g*.1);v*=clothingMult(c,a);return v}
function chooseCard(a,b,ex){let pool=C.filter(c=>c.level===G.level&&c.id!==ex&&compatible(c,a,b));if(!pool.length)pool=C.filter(c=>c.level===G.level&&c.id!==ex);return w(pool,c=>cardScore(c,a,b))}
function buttons(){playerButtons.innerHTML="";G.players.forEach(p=>{let b=document.createElement("button");b.innerHTML='<b>'+p.name+'</b><br><span class="loss">🏆 '+p.losses+' perdas</span> · <span class="cloth">👕 '+p.clothing+'</span>';b.onclick=()=>pick(p);playerButtons.appendChild(b)})}
function renderStats(){let r=[...G.players].sort((a,b)=>b.losses-a.losses||a.name.localeCompare(b.name));ranking.innerHTML=r.map((p,i)=>'<div class="row '+(i===0?'rank1':'')+'"><span>'+(i===0?'🏆 ':'')+(i+1)+'. '+p.name+'</span><b>'+p.losses+'</b></div>').join("");clothing.innerHTML=G.players.map(p=>'<div class="row"><span>'+p.name+'</span><b>👕 '+(p.clothing===0?"0 · sem roupa":p.clothing<0?p.clothing+" · saldo":p.clothing)+'</b></div>').join("");inventory.innerHTML=G.players.map(p=>'<div class="row"><b>'+p.name+'</b><span>'+(p.powers.map(x=>'<i class="chip">'+PW[x]+'</i>').join("")||"—")+'</span></div>').join("");tv.textContent=G.temperature;sv.textContent=G.tension;tfill.style.width=Math.min(100,G.temperature)+"%";sfill.style.width=Math.min(100,G.tension)+"%";phaseName.textContent="FASE "+G.level+"/5 · "+P[G.level-1];pc.textContent=G.penalties;
let mins=phaseMins(),elapsed=G.penalties-G.phaseStartedAt,need=mins[G.level-1]||1;
let prog=G.level===5?100:Math.max(0,Math.min(100,elapsed/need*100));phaseFill.style.width=prog+"%";
if(G.level===3&&elapsed>=need&&!clothingReadyFor4()){
 let atOne=G.players.filter(p=>p.clothing<=1).length;
 phaseHint.textContent="Tempo mínimo cumprido · roupa: "+atOne+"/"+G.players.length+" com 1 peça ou menos; Fase 4 libera com ≥75% e ninguém acima de 2";
}else if(G.level<5)phaseHint.textContent="Nesta fase: "+elapsed+" / "+need+" penalidades mínimas";
else phaseHint.textContent="Fase final"}
function pick(a){a.losses++;let b=target(a);G.current={a:a.id,b:b.id,c:chooseCard(a,b)};render();renderStats();buttons();save()}
function render(){let a=pl(G.current.a),b=pl(G.current.b),c=G.current.c;an.textContent=a.name;bn.textContent=b.name;text.textContent=c.text.ptBR.replace(/\bA\b/g,a.name).replace(/\bB\b/g,b.name);cat.textContent="FASE "+c.level+" · 🔥 "+(c.temperatureDelta>=0?"+":"")+c.temperatureDelta+" · 🌀 "+(c.tensionDelta>=0?"+":"")+c.tensionDelta;chooser.classList.add("hidden");penalty.classList.remove("hidden");if(b.powers.length){power.classList.remove("hidden");pt.textContent="⚡ "+b.name+", você pode usar um poder";pb.innerHTML="";b.powers.forEach((x,i)=>{let q=document.createElement("button");q.textContent=PW[x];q.onclick=()=>use(b,i);pb.appendChild(q)})}else power.classList.add("hidden")}
function use(o,i){let x=o.powers[i];if(x==="REVERSE"){[G.current.a,G.current.b]=[G.current.b,G.current.a]}else if(x==="REDIRECT"){G.current.b=target(pl(G.current.a)).id}else G.current.c=chooseCard(pl(G.current.a),pl(G.current.b),G.current.c.id);o.powers.splice(i,1);render();renderStats();save()}
function applyClothing(a,c){if(!c.clothingDelta)return;a.clothing=Math.max(-2,Math.min(G.initialPieces,a.clothing+c.clothingDelta))}
function finish(dr){let a=pl(G.current.a),b=pl(G.current.b),c=G.current.c,s=st(a,b);s.n++;s.last=G.penalties;s.dir[dk(a,b)]=(s.dir[dk(a,b)]||0)+1;a.cards[c.id]=(a.cards[c.id]||0)+1;b.cards[c.id]=(b.cards[c.id]||0)+1;G.cc[c.id]=(G.cc[c.id]||0)+1;G.penalties++;if(dr){G.tension=Math.min(100,G.tension+1);let ids=Object.keys(PW),x=ids[Math.floor(rnd()*ids.length)];b.powers.push(x);oi.textContent="⚡";ot.textContent=b.name+" ganhou "+PW[x];ox.textContent="O poder ficou guardado."}else{G.temperature=Math.max(0,Math.min(100,G.temperature+(c.temperatureDelta||0)));G.tension=Math.max(0,Math.min(100,G.tension+(c.tensionDelta||0)));applyClothing(a,c)}G.current=null;penalty.classList.add("hidden");chooser.classList.remove("hidden");updatePhase();renderStats();buttons();save();if(dr)overlay.classList.remove("hidden")}
function save(){localStorage.setItem("calorBoard083",JSON.stringify(G))}
done.onclick=()=>finish(false);drink.onclick=()=>finish(true);ok.onclick=()=>overlay.classList.add("hidden");
start.onclick=()=>{if(!adult.checked)return alert("Confirme a participação voluntária.");let ps=[];for(let i=0;i<+count.value;i++)ps.push({id:"P"+(i+1),name:$("p"+i).value.trim()||"Jogador "+(i+1),losses:0,benefits:0,powers:[],cards:{},clothing:+pieces.value});G={version:"0.8.3",seed:Date.now()>>>0,temperature:5,tension:5,level:1,penalties:0,phaseStartedAt:0,initialPieces:+pieces.value,players:ps,pairs:{},cc:{}};setup.classList.add("hidden");game.classList.remove("hidden");renderStats();buttons();save()}
end.onclick=()=>{if(!confirm("Encerrar e ver o ranking?"))return;let r=[...G.players].sort((a,b)=>b.losses-a.losses),m=r[0].losses,w=r.filter(x=>x.losses===m);oi.textContent="🏆🔥";ot.textContent=w.length===1?w[0].name+" — Ganhador de Penalidades":"Ganhadores de Penalidades";ox.textContent=w.map(x=>x.name).join(" & ")+" · "+m+" perdas no jogo externo";overlay.classList.remove("hidden")}
fetch("./cards.json",{cache:"no-store"}).then(r=>r.json()).then(x=>C=x).catch(()=>alert("Erro ao carregar cards.json"));if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script></body></html>
